name: Change something in Instagram
description: Describe what you want Instagram to do, or stop doing. Plain English is fine.
title: "Idea: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: No technical details needed. Describe the change the way you'd tell a friend.
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: What you want Instagram to do, or stop doing.
      placeholder: Hide like counts on every post in the feed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What bothers you about how it works now. Optional.
      placeholder: I keep comparing my posts with my friends' posts.
  - type: textarea
    id: where
    attributes:
      label: Where in the app?
      description: The tab or screen, if you know it. A screenshot helps. Optional.
      placeholder: Home feed and the profile grid.
